<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Operação - Airsoft Arena</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Tema Militar Premium */
        :root {
            --military-green: #2d4a22;
            --military-dark: #1a2f14;
            --military-brown: #6b4423;
            --military-sand: #c4a47c;
            --army-patch: #4a6b2f;
            --gold: #ffd700;
            --danger: #8b0000;
            --success: #2ecc71;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Tahoma', Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--military-dark) 0%, var(--military-green) 100%);
            min-height: 100vh;
            position: relative;
        }
        
        /* Padrão de camuflagem de fundo */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.05"><path d="M10,10 L20,20 M30,15 L40,25 M50,10 L60,20 M70,15 L80,25 M15,50 L25,60 M35,55 L45,65 M55,50 L65,60 M75,55 L85,65 M10,80 L20,90 M50,80 L60,90" stroke="white" stroke-width="2"/><circle cx="50" cy="50" r="2" fill="white"/><circle cx="20" cy="80" r="2" fill="white"/><circle cx="80" cy="30" r="2" fill="white"/></svg>');
            background-repeat: repeat;
            pointer-events: none;
        }
        
        .detalhe-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Breadcrumb de navegação */
        .breadcrumb {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 30px;
            color: white;
            font-size: 14px;
        }
        
        .breadcrumb a {
            color: var(--gold);
            text-decoration: none;
        }
        
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        
        /* Hero Section */
        .hero-battle {
            background: linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.7) 100%);
            backdrop-filter: blur(10px);
            border: 2px solid var(--military-brown);
            border-radius: 20px;
            padding: 50px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .hero-battle::before {
            content: "⚔️";
            font-size: 150px;
            position: absolute;
            right: -20px;
            bottom: -40px;
            opacity: 0.08;
            pointer-events: none;
        }
        
        .hero-battle h1 {
            font-size: 48px;
            color: var(--gold);
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }
        
        .hero-battle p {
            font-size: 18px;
            color: var(--military-sand);
            margin-bottom: 25px;
        }
        
        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        
        .info-badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--military-brown);
            border-radius: 50px;
            padding: 8px 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: white;
        }
        
        .info-badge strong {
            color: var(--gold);
        }
        
        /* Grid de informações */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .info-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border-left: 4px solid var(--gold);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        .info-card h3 {
            color: var(--gold);
            font-size: 22px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-card h3 i {
            font-size: 28px;
        }
        
        .regras-list, .equip-list {
            list-style: none;
            padding-left: 0;
        }
        
        .regras-list li, .equip-list li {
            padding: 10px 0;
            padding-left: 25px;
            position: relative;
            color: #ddd;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .regras-list li:last-child, .equip-list li:last-child {
            border-bottom: none;
        }
        
        .regras-list li::before {
            content: "▹";
            position: absolute;
            left: 0;
            color: var(--gold);
            font-size: 16px;
        }
        
        .equip-list li::before {
            content: "⚙️";
            position: absolute;
            left: 0;
        }
        
        /* Card de informações gerais */
        .general-info {
            background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.6) 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid var(--military-brown);
        }
        
        .general-info h3 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 22px;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--gold);
            display: block;
        }
        
        .stat-label {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
            display: block;
        }
        
        .price-tag {
            background: var(--success);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }
        
        /* Botões */
        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-primary, .btn-secondary {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--success) 0%, #239b56 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }
        
        .btn-primary:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: var(--military-brown);
            color: white;
        }
        
        .btn-secondary:hover {
            background: #8b5a2b;
            transform: translateY(-2px);
        }
        
        /* Modal de confirmação */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        
        .modal.active {
            display: flex;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            background: linear-gradient(135deg, var(--military-dark) 0%, #0a1a08 100%);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }
        
        .modal h2 {
            color: var(--gold);
            margin-bottom: 15px;
        }
        
        .modal p {
            color: white;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .modal-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal-btn.confirm {
            background: var(--success);
            color: white;
        }
        
        .modal-btn.confirm:hover {
            background: #239b56;
            transform: scale(1.05);
        }
        
        .modal-btn.cancel {
            background: var(--danger);
            color: white;
        }
        
        .modal-btn.cancel:hover {
            background: #cc0000;
            transform: scale(1.05);
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 50px;
            color: white;
        }
        
        .loading::after {
            content: "⚡";
            display: inline-block;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Mensagem de status */
        .toast-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--success);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1001;
            animation: slideInRight 0.3s ease;
            display: none;
        }
        
        .toast-message.error {
            background: var(--danger);
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Responsividade */
        @media (max-width: 768px) {
            .hero-battle {
                padding: 30px;
            }
            
            .hero-battle h1 {
                font-size: 32px;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn-primary, .btn-secondary {
                justify-content: center;
            }
            
            .hero-battle::before {
                font-size: 80px;
            }
        }
    </style>

    <script>
    // Detectar se é celular e carregar CSS específico
    if (window.innerWidth <= 768) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/mobile.css?t=' + Date.now();
        document.head.appendChild(link);
        document.body.classList.add('mobile-mode');
    }
    </script>

</head>
<body>
    <div class="detalhe-container">
        <div class="breadcrumb">
            🏠 <a href="/dashboard.html">Dashboard</a> → <a href="/dashboard.html">Jogos</a> → <span style="color: var(--gold);">Detalhes da Operação</span>
        </div>
        
        <div id="detalheContent" style="min-height: 400px;">
            <div class="loading">Carregando informações da operação...</div>
        </div>
        
        <div class="action-buttons">
            <button onclick="window.location.href='/dashboard.html'" class="btn-secondary">
                ← Voltar ao Quartel
            </button>
        </div>
    </div>
    
    <!-- Modal de confirmação -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">⚔️</div>
            <h2>Confirmar Inscrição</h2>
            <p>Você está prestes a se inscrever na operação:</p>
            <p><strong id="modalJogoTitulo" style="color: var(--gold);"></strong></p>
            <p>Deseja confirmar sua participação?</p>
            <div class="modal-buttons">
                <button class="modal-btn confirm" onclick="confirmarInscricao()">✅ Confirmar</button>
                <button class="modal-btn cancel" onclick="fecharModal()">❌ Cancelar</button>
            </div>
        </div>
    </div>
    
    <!-- Toast message -->
    <div id="toastMessage" class="toast-message"></div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const jogoId = urlParams.get('id');
        let jogoAtual = null;
        
        function mostrarToast(mensagem, tipo = 'success') {
            const toast = document.getElementById('toastMessage');
            toast.textContent = mensagem;
            toast.className = `toast-message ${tipo}`;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
        
        function abrirModal() {
            document.getElementById('confirmModal').classList.add('active');
        }
        
        function fecharModal() {
            document.getElementById('confirmModal').classList.remove('active');
        }
        
        async function confirmarInscricao() {
            const usuario = localStorage.getItem('usuario');
            if(!usuario) {
                mostrarToast('Você precisa estar logado para se inscrever!', 'error');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
                return;
            }
            
            const usuarioLogado = JSON.parse(usuario);
            
            try {
                const response = await fetch('/api/inscrever', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        usuario_id: usuarioLogado.id, 
                        jogo_id: jogoId 
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    mostrarToast('✅ Inscrição realizada com sucesso! Redirecionando...', 'success');
                    fecharModal();
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 2000);
                } else {
                    mostrarToast(data.erro || 'Erro ao se inscrever', 'error');
                    fecharModal();
                }
            } catch(error) {
                mostrarToast('Erro de conexão com o servidor', 'error');
                fecharModal();
            }
        }
        
        function inscrever() {
            if (!jogoAtual) return;
            
            if (jogoAtual.vagas_ocupadas >= jogoAtual.vagas) {
                mostrarToast('❌ Desculpe, as vagas para esta operação estão esgotadas!', 'error');
                return;
            }
            
            // Abrir modal de confirmação
            document.getElementById('modalJogoTitulo').textContent = jogoAtual.titulo;
            abrirModal();
        }
        
        async function carregarDetalhes() {
            try {
                const response = await fetch(`/api/jogo/${jogoId}`);
                const jogo = await response.json();
                jogoAtual = jogo;
                
                const vagasRestantes = jogo.vagas - (jogo.vagas_ocupadas || 0);
                const estaEsgotado = vagasRestantes <= 0;
                
                document.getElementById('detalheContent').innerHTML = `
                    <div class="hero-battle">
                        <h1>🎯 ${jogo.titulo}</h1>
                        <p>Operação Especial: ${jogo.tipo || 'Campo Aberto'}</p>
                        <div class="badge-container">
                            <span class="info-badge">📅 ${formatarData(jogo.data)}</span>
                            <span class="info-badge">⏰ ${jogo.horario}</span>
                            <span class="info-badge">🏟️ ${jogo.campo || jogo.localizacao || 'A definir'}</span>
                        </div>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-card">
                            <h3>📜 REGRAS DA OPERAÇÃO</h3>
                            <ul class="regras-list">
                                ${formatarRegras(jogo.regras)}
                            </ul>
                        </div>
                        
                        <div class="info-card">
                            <h3>⚙️ EQUIPAMENTOS OBRIGATÓRIOS</h3>
                            <ul class="equip-list">
                                ${formatarEquipamentos(jogo.equipamentos)}
                            </ul>
                        </div>
                    </div>
                    
                    <div class="general-info">
                        <h3>📋 INFORMAÇÕES GERAIS</h3>
                        <div class="stats-row">
                            <div class="stat-item">
                                <span class="stat-value">${vagasRestantes}/${jogo.vagas}</span>
                                <span class="stat-label">Vagas Disponíveis</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value">${jogo.valor ? 'R$ ' + jogo.valor : 'GRATUITO'}</span>
                                <span class="stat-label">Valor da Inscrição</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value">30 min</span>
                                <span class="stat-label">Check-in Antecedência</span>
                            </div>
                        </div>
                        <div style="margin-top: 20px;">
                            <p><strong>📍 Localização:</strong> ${jogo.campo || jogo.localizacao || 'A ser definido'}</p>
                            ${jogo.descricao ? `<p><strong>📝 Descrição:</strong> ${jogo.descricao}</p>` : ''}
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button onclick="inscrever()" class="btn-primary" id="btnInscrever" ${estaEsgotado ? 'disabled' : ''}>
                            ${estaEsgotado ? '❌ VAGAS ESGOTADAS' : '🔥 INSCREVER-SE NA OPERAÇÃO'}
                        </button>
                        <button onclick="window.location.href='/dashboard.html'" class="btn-secondary">
                            ← Voltar ao Quartel
                        </button>
                    </div>
                `;
            } catch(error) {
                console.error('Erro:', error);
                document.getElementById('detalheContent').innerHTML = `
                    <div class="hero-battle">
                        <h1>⚠️ Erro ao carregar</h1>
                        <p>Não foi possível carregar os detalhes da operação.</p>
                        <button onclick="window.location.href='/dashboard.html'" class="btn-secondary">Voltar</button>
                    </div>
                `;
            }
        }
        
        function formatarData(data) {
            if (!data) return 'Data a definir';
            const partes = data.split('-');
            if (partes.length === 3) {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            return data;
        }
        
        function formatarRegras(regras) {
            if (!regras) {
                return '<li>Regras serão informadas no briefing antes do jogo</li>';
            }
            
            // Se regras vier com quebras de linha
            const linhas = regras.split('\n');
            if (linhas.length > 1) {
                return linhas.map(linha => `<li>${linha.replace('•', '').trim()}</li>`).join('');
            }
            
            // Se for texto único
            if (regras.includes(',')) {
                return regras.split(',').map(r => `<li>${r.trim()}</li>`).join('');
            }
            
            return `<li>${regras}</li>`;
        }
        
        function formatarEquipamentos(equipamentos) {
            if (!equipamentos) {
                return '<li>Óculos de proteção</li><li>Máscara facial</li><li>Coldre para pistola</li>';
            }
            
            if (equipamentos.includes(',')) {
                return equipamentos.split(',').map(e => `<li>${e.trim()}</li>`).join('');
            }
            
            if (equipamentos.includes('\n')) {
                return equipamentos.split('\n').map(e => `<li>${e.trim()}</li>`).join('');
            }
            
            return `<li>${equipamentos}</li>`;
        }
        
        carregarDetalhes();
    </script>
</body>
</html>
