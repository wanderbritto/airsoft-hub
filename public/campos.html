<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airsoft Hub - Campos Cadastrados</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --military-green: #2d4a22;
            --military-dark: #1a2f14;
            --military-brown: #6b4423;
            --military-sand: #c4a47c;
            --army-patch: #4a6b2f;
            --gold: #ffd700;
            --danger: #8b0000;
            --success: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--military-dark) 0%, var(--military-green) 100%);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.03"><path d="M10,10 L20,20 M30,15 L40,25 M50,10 L60,20 M70,15 L80,25 M15,50 L25,60 M35,55 L45,65 M55,50 L65,60 M75,55 L85,65 M10,80 L20,90 M50,80 L60,90" stroke="white" stroke-width="2"/><circle cx="50" cy="50" r="2" fill="white"/><circle cx="20" cy="80" r="2" fill="white"/><circle cx="80" cy="30" r="2" fill="white"/></svg>');
            background-repeat: repeat;
            pointer-events: none;
        }

        .campos-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .page-header {
            background: linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.7) 100%);
            backdrop-filter: blur(10px);
            border: 2px solid var(--military-brown);
            border-radius: 20px;
            padding: 25px 35px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title h1 {
            color: var(--gold);
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header-title p {
            color: var(--military-sand);
            font-size: 14px;
        }

        .btn-voltar {
            background: var(--army-patch);
            color: white;
            border: 1px solid var(--gold);
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-voltar:hover {
            background: var(--gold);
            color: var(--military-dark);
            transform: translateY(-2px);
        }

        /* Estatísticas */
        .stats-campos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--military-brown);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: var(--gold);
        }

        .stat-label {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }

        /* Grid de Campos */
        .campos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
        }

        .campo-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s;
            border: 1px solid var(--military-brown);
        }

        .campo-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .campo-header {
            background: linear-gradient(135deg, var(--army-patch) 0%, var(--military-green) 100%);
            padding: 20px;
            position: relative;
        }

        .campo-header::before {
            content: "🏟️";
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 40px;
            opacity: 0.3;
        }

        .campo-nome {
            font-size: 22px;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 5px;
        }

        .campo-data {
            font-size: 11px;
            color: var(--military-sand);
        }

        .campo-body {
            padding: 20px;
        }

        .campo-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            color: #ddd;
            font-size: 14px;
        }

        .campo-info-icon {
            width: 25px;
            font-size: 18px;
        }

        .campo-descricao {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            color: #bbb;
            font-size: 13px;
            line-height: 1.5;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #aaa;
            grid-column: 1/-1;
        }

        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: var(--gold);
            margin-bottom: 10px;
        }

        .btn-cadastrar {
            background: var(--danger);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-cadastrar:hover {
            background: #cc0000;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            grid-column: 1/-1;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--gold);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .campos-container {
                padding: 20px 15px;
            }
            
            .page-header {
                flex-direction: column;
                text-align: center;
            }
            
            .campos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="campos-container">
        <!-- Header -->
        <div class="page-header">
            <div class="header-title">
                <h1>🏟️ CAMPOS DE AIRSOFT</h1>
                <p>Locais cadastrados para as operações táticas</p>
            </div>
            <div>
                <button onclick="window.location.href='/admin.html'" class="btn-voltar">← VOLTAR PARA ADMIN</button>
                <button onclick="window.location.href='/dashboard.html'" class="btn-voltar" style="margin-left: 10px;">🎮 DASHBOARD</button>
            </div>
        </div>

        <!-- Estatísticas -->
        <div class="stats-campos">
            <div class="stat-card">
                <div class="stat-number" id="totalCampos">0</div>
                <div class="stat-label">Total de Campos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="ativosCount">0</div>
                <div class="stat-label">Campos Ativos</div>
            </div>
        </div>

        <!-- Lista de Campos -->
        <div id="camposList" class="campos-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Carregando campos...</p>
            </div>
        </div>
    </div>

    <script>
        function carregarCampos() {
            const campos = JSON.parse(localStorage.getItem('camposAirsoft') || '[]');
            const container = document.getElementById('camposList');
            
            // Atualizar estatísticas
            document.getElementById('totalCampos').textContent = campos.length;
            document.getElementById('ativosCount').textContent = campos.length;
            
            if (campos.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏟️</div>
                        <h3>Nenhum Campo Cadastrado</h3>
                        <p>Você ainda não cadastrou nenhum campo de airsoft.</p>
                        <button onclick="window.location.href='/admin.html'" class="btn-cadastrar">➕ CADASTRAR CAMPO AGORA</button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = campos.map(campo => `
                <div class="campo-card">
                    <div class="campo-header">
                        <div class="campo-nome">🏟️ ${campo.nome}</div>
                        <div class="campo-data">Cadastrado em: ${formatarData(campo.data_cadastro)}</div>
                    </div>
                    <div class="campo-body">
                        <div class="campo-info">
                            <span class="campo-info-icon">📍</span>
                            <span>${campo.endereco}</span>
                        </div>
                        ${campo.telefone ? `
                        <div class="campo-info">
                            <span class="campo-info-icon">📞</span>
                            <span>${campo.telefone}</span>
                        </div>
                        ` : ''}
                        ${campo.descricao ? `
                        <div class="campo-descricao">
                            📝 ${campo.descricao}
                        </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function formatarData(dataISO) {
            if (!dataISO) return 'Data desconhecida';
            const data = new Date(dataISO);
            return data.toLocaleDateString('pt-BR');
        }
        
        carregarCampos();
    </script>
</body>
</html>
